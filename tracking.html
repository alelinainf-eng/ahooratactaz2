<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پیگیری درخواست | اهورا تکتاز خاورمیانس</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="inner-page">

    <header class="inner-header">

        <a href="index.html" class="back-btn">
            ← بازگشت
        </a>

        <div class="page-brand">

            <div class="mini-logo">
                ATK
            </div>

            <div>
                <h1>اهورا تکتاز خاورمیانس</h1>
                <span>سامانه خدمات و گارانتی</span>
            </div>

        </div>

    </header>


    <section class="page-content">

        <div class="page-title">

            <span>REQUEST TRACKING</span>

            <h2>
                پیگیری درخواست
            </h2>

            <p>
                کد پیگیری درخواست خود را وارد کنید.
            </p>

        </div>


        <form class="warranty-form" id="trackingForm">

            <div class="input-group">

                <label for="trackingCode">
                    کد پیگیری
                </label>

                <input
                    type="text"
                    id="trackingCode"
                    placeholder="کد پیگیری درخواست"
                    autocomplete="off"
                >

            </div>


            <button
                type="submit"
                class="gold-button"
            >

                پیگیری درخواست

                <span>
                    →
                </span>

            </button>

        </form>


        <div
            id="trackingResult"
            class="result-box"
        ></div>

    </section>

</main>


<script src="js/script.js"></script>

</body>
</html>
