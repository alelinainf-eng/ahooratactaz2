<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت درخواست گارانتی | اهورا تکتاز خاورمیانس</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="inner-page">

    <header class="inner-header">

        <a href="index.html" class="back-btn">
            ← بازگشت
        </a>

        <div class="page-brand">
            <div class="mini-logo">ATK</div>

            <div>
                <h1>اهورا تکتاز خاورمیانس</h1>
                <span>سامانه خدمات و گارانتی</span>
            </div>
        </div>

    </header>


    <section class="page-content">

        <div class="page-title">
            <span>WARRANTY REQUEST</span>
            <h2>ثبت درخواست گارانتی</h2>
            <p>اطلاعات درخواست خود را وارد کنید.</p>
        </div>


        <form class="warranty-form" id="requestForm">

            <div class="input-group">
                <label for="name">نام و نام خانوادگی</label>
                <input
                    type="text"
                    id="name"
                    placeholder="نام و نام خانوادگی"
                >
            </div>

            <div class="input-group">
                <label for="phone">شماره تماس</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="09xxxxxxxxx"
                >
            </div>

            <div class="input-group">
                <label for="serialRequest">شماره سریال قطعه</label>
                <input
                    type="text"
                    id="serialRequest"
                    placeholder="شماره سریال"
                >
            </div>

            <button type="submit" class="gold-button">
                ثبت درخواست
                <span>→</span>
            </button>

        </form>

        <div id="requestResult" class="result-box"></div>

    </section>

</main>

<script src="js/script.js"></script>

</body>
</html>
