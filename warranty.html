<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام گارانتی | اهورا تکتاز خاورمیانس</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="inner-page">

    <header class="inner-header">

        <a href="index.html" class="back-btn">
            ← بازگشت
        </a>

        <div class="page-brand">
            <div class="mini-logo">ATK</div>

            <div>
                <h1>اهورا تکتاز خاورمیانس</h1>
                <span>سامانه خدمات و گارانتی</span>
            </div>
        </div>

    </header>


    <section class="page-content">

        <div class="page-title">
            <span>GARANTEE CHECK</span>
            <h2>استعلام گارانتی</h2>
            <p>
                برای مشاهده وضعیت گارانتی قطعه، اطلاعات زیر را وارد کنید.
            </p>
        </div>


        <form class="warranty-form">

            <div class="input-group">
                <label for="serial">شماره سریال قطعه</label>
                <input
                    type="text"
                    id="serial"
                    placeholder="شماره سریال را وارد کنید"
                    autocomplete="off"
                >
            </div>


            <div class="input-group">
                <label for="national">کد گارانتی</label>
                <input
                    type="text"
                    id="national"
                    placeholder="کد گارانتی را وارد کنید"
                    autocomplete="off"
                >
            </div>


            <button type="submit" class="gold-button">
                استعلام گارانتی
                <span>→</span>
            </button>

        </form>


        <div id="result" class="result-box"></div>

    </section>

</main>

<script src="js/script.js"></script>

</body>
</html>
