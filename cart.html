<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سبد خدمات | اهورا تکتاز خاورمیانس</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="inner-page">

    <header class="inner-header">

        <a href="index.html" class="back-btn">
            ← بازگشت
        </a>

        <div class="page-brand">

            <div class="mini-logo">
                ATK
            </div>

            <div>
                <h1>اهورا تکتاز خاورمیانس</h1>
                <span>سامانه خدمات و گارانتی</span>
            </div>

        </div>

    </header>


    <section class="cart-page-content">

        <div class="page-title">

            <span>SERVICE CART</span>

            <h2>
                سبد خدمات
            </h2>

            <p>
                خدمات موردنظر خود را انتخاب کنید.
            </p>

        </div>


        <div class="cart-services">

            <label class="cart-service">

                <input type="checkbox" value="استعلام گارانتی">

                <div class="cart-service-icon">
                    🔍
                </div>

                <div class="cart-service-info">
                    <h3>
                        استعلام گارانتی
                    </h3>

                    <p>
                        بررسی وضعیت گارانتی قطعه
                    </p>
                </div>

                <span class="check-mark">
                    ✓
                </span>

            </label>


            <label class="cart-service">

                <input type="checkbox" value="ثبت درخواست گارانتی">

                <div class="cart-service-icon">
                    📦
                </div>

                <div class="cart-service-info">
                    <h3>
                        ثبت درخواست گارانتی
                    </h3>

                    <p>
                        ثبت درخواست دریافت خدمات گارانتی
                    </p>
                </div>

                <span class="check-mark">
                    ✓
                </span>

            </label>


            <label class="cart-service">

                <input type="checkbox" value="پیگیری درخواست">

                <div class="cart-service-icon">
                    📋
                </div>

                <div class="cart-service-info">
                    <h3>
                        پیگیری درخواست
                    </h3>

                    <p>
                        مشاهده وضعیت درخواست ثبت‌شده
                    </p>
                </div>

                <span class="check-mark">
                    ✓
                </span>

            </label>


            <label class="cart-service">

                <input type="checkbox" value="خدمات تعمیر و پشتیبانی">

                <div class="cart-service-icon">
                    🔧
                </div>

                <div class="cart-service-info">
                    <h3>
                        خدمات تعمیر و پشتیبانی
                    </h3>

                    <p>
                        دریافت خدمات تخصصی و پشتیبانی
                    </p>
                </div>

                <span class="check-mark">
                    ✓
                </span>

            </label>

        </div>


        <div class="cart-bottom">

            <div class="cart-summary">

                <span>
                    خدمات انتخاب‌شده:
                </span>

                <strong id="cartCount">
                    ۰ مورد
                </strong>

            </div>


            <button
                type="button"
                class="gold-button"
                id="continueCart"
            >
                ادامه و ثبت خدمات
                <span>←</span>
            </button>

        </div>


        <div
            id="cartResult"
            class="result-box"
        ></div>

    </section>

</main>


<script src="js/script.js"></script>

</body>
</html>
