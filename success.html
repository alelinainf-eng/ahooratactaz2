<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ثبت موفق | اهورا تکتاز خاورمیانس</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="inner-page">

    <header class="inner-header">

        <a href="index.html" class="back-btn">
            صفحه اصلی ←
        </a>

        <div class="page-brand">

            <div class="mini-logo">
                ATK
            </div>

            <div>
                <h1>اهورا تکتاز خاورمیانس</h1>
                <span>سامانه خدمات و گارانتی</span>
            </div>

        </div>

    </header>


    <section class="success-page-content">

        <div class="success-icon">
            ✓
        </div>

        <span class="success-label">
            SUCCESSFULLY REGISTERED
        </span>

        <h2>
            درخواست شما با موفقیت ثبت شد
        </h2>

        <p>
            درخواست خدمات شما با موفقیت در سامانه ثبت شد.
            کد پیگیری خود را برای پیگیری‌های بعدی نگه دارید.
        </p>


        <div class="tracking-box">

            <span>
                کد پیگیری شما
            </span>

            <strong id="generatedTrackingCode">
                ------
            </strong>

        </div>


        <div class="success-actions">

            <a
                href="tracking.html"
                class="gold-button"
            >
                پیگیری درخواست
                <span>←</span>
            </a>

            <a
                href="index.html"
                class="success-home"
            >
                بازگشت به صفحه اصلی
            </a>

        </div>

    </section>

</main>

<script src="js/script.js"></script>

</body>
</html>
